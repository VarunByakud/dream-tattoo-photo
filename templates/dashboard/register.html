<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dream Studio</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #080808;
            color: #F8F9FA;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            background: radial-gradient(circle at center, #1A1A1A 0%, #050505 100%);
        }
        .register-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(214, 175, 55, 0.15);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .register-card:hover {
            border-color: rgba(214, 175, 55, 0.4);
            box-shadow: 0 15px 50px rgba(214, 175, 55, 0.1);
        }
        .logo-title {
            font-family: 'Playfair Display', serif;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-title span {
            color: #fff;
        }
        .form-label-custom {
            color: #D4AF37;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .form-control-custom {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: #fff !important;
            padding: 10px 15px;
            border-radius: 8px;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
        }
        .form-control-custom:focus {
            background: rgba(0, 0, 0, 0.7) !important;
            border-color: #D4AF37 !important;
            box-shadow: 0 0 10px rgba(214, 175, 55, 0.2) !important;
            outline: none;
        }
        .btn-gold {
            background: #D4AF37;
            color: #0A0A0A;
            border: 1px solid #D4AF37;
            padding: 12px;
            border-radius: 25px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background: #F3E5AB;
            box-shadow: 0 0 15px rgba(214, 175, 55, 0.4);
            transform: translateY(-1px);
        }
        .btn-link-gold {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .btn-link-gold:hover {
            color: #F3E5AB;
        }
        select option {
            background-color: #1A1A1A !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h1 class="logo-title">Dream <span>Studio</span></h1>
        
        {% if error %}
            <div class="alert alert-danger bg-danger-subtle text-danger border border-danger-subtle py-2 px-3 small rounded-3 mb-4">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="{% url 'dashboard:register' %}">
            {% csrf_token %}
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Username</label>
                    <input type="text" name="username" class="form-control form-control-custom" placeholder="Choose username" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Email</label>
                    <input type="email" name="email" class="form-control form-control-custom" placeholder="email@example.com" required>
                </div>
            </div>
            
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Role Type</label>
                    <select name="role" class="form-select form-control-custom" required>
                        <option value="Customer" selected>Customer</option>
                        <option value="Staff">Staff</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label form-label-custom">Mobile Number</label>
                <input type="tel" name="mobile" class="form-control form-control-custom" placeholder="e.g. +91 9876543210" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label form-label-custom">Full Address</label>
                <textarea name="address" class="form-control form-control-custom" rows="2" placeholder="Enter permanent address"></textarea>
            </div>
            
            <button type="submit" class="btn btn-gold mb-3">Create Account</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="small text-muted">Already have an account?</span>
            <a href="{% url 'dashboard:login' %}" class="btn-link-gold ms-1 small">Sign In</a>
        </div>
    </div>

</body>
</html>
